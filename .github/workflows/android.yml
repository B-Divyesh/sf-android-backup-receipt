name: Publish Android artifact

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'capacitor.config.ts'
      - 'scripts/**'
      - 'vite.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android.yml'

permissions:
  contents: write

concurrency:
  group: android-release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Restore protected factory signing key
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_RELEASE_KEYSTORE_BASE64" || { echo 'ANDROID_RELEASE_KEYSTORE_BASE64 is required'; exit 1; }
          printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
      - name: Build signed release artifacts
        working-directory: android
        env:
          RELEASE_STORE_FILE: app/release.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$RELEASE_STORE_PASSWORD" -a -n "$RELEASE_KEY_ALIAS" -a -n "$RELEASE_KEY_PASSWORD" || { echo 'Android signing secrets are required'; exit 1; }
          export ANDROID_VERSION_CODE=$((100000 + GITHUB_RUN_NUMBER))
          export ANDROID_VERSION_NAME="1.0.2.${GITHUB_RUN_NUMBER}"
          ./gradlew assembleRelease bundleRelease
          mkdir -p ../release
          cp app/build/outputs/apk/release/app-release.apk ../release/android-backup-receipt.apk
          cp app/build/outputs/bundle/release/app-release.aab ../release/android-backup-receipt.aab
          keytool -list -v -keystore app/release.keystore -storepass "$RELEASE_STORE_PASSWORD" -alias "$RELEASE_KEY_ALIAS" | sed -n 's/^[[:space:]]*SHA256: /SHA-256: /p' > ../release/SIGNING_CERT_SHA256.txt
          test -s ../release/SIGNING_CERT_SHA256.txt
          cd ../release
          sha256sum android-backup-receipt.apk android-backup-receipt.aab > SHA256SUMS
          rm -f ../android/app/release.keystore
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="android-v1.0.2-build-${GITHUB_RUN_NUMBER}"
          gh release create "$RELEASE_TAG" --latest --title "Android Backup Receipt 1.0.2 (build ${GITHUB_RUN_NUMBER})" --notes "Signed with the stable factory key. Android version code: $((100000 + GITHUB_RUN_NUMBER)). Verify SHA256SUMS and SIGNING_CERT_SHA256.txt before sideloading." release/android-backup-receipt.apk release/android-backup-receipt.aab release/SHA256SUMS release/SIGNING_CERT_SHA256.txt
